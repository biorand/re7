name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "staging", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
    env:
      BIORAND_RE7_TEST_PAK_URL: ${{ secrets.BIORAND_RE7_TEST_PAK_URL }}
      BIORAND_RE7_TEST_PAK_SHA256: ${{ secrets.BIORAND_RE7_TEST_PAK_SHA256 }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0
    - name: Test REFramework Lua scripts
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        lua5.4 tests/lua/run.lua
    - name: Download baseline PAK
      if: env.BIORAND_RE7_TEST_PAK_URL != ''
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.biorand"
        pak_path="$HOME/.biorand/biorand-re7.pak"
        curl --fail --location --retry 3 --retry-delay 5 --output "$pak_path" "$BIORAND_RE7_TEST_PAK_URL"
        if [ -n "$BIORAND_RE7_TEST_PAK_SHA256" ]; then
          echo "$BIORAND_RE7_TEST_PAK_SHA256  $pak_path" | sha256sum --check --strict
        fi
        echo "BIORAND_RE7_TEST_PAK=$pak_path" >> "$GITHUB_ENV"
    - name: Require full validation for release candidates
      if: github.event_name != 'pull_request'
      run: |
        if [ -z "$BIORAND_RE7_TEST_PAK_URL" ] || [ -z "$BIORAND_RE7_TEST_PAK_SHA256" ]; then
          echo "::error::Release validation requires the baseline PAK URL and SHA256 secrets."
          exit 1
        fi
    - name: Note missing baseline PAK
      if: env.BIORAND_RE7_TEST_PAK_URL == ''
      run: echo "::notice::BIORAND_RE7_TEST_PAK_URL is not configured; pak-dependent tests will be skipped."
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c ${{ matrix.configuration }}
    - name: Test
      if: env.BIORAND_RE7_TEST_PAK_URL != ''
      run: dotnet test --no-build -c ${{ matrix.configuration }} --verbosity normal
    - name: Test without baseline PAK
      if: env.BIORAND_RE7_TEST_PAK_URL == ''
      run: dotnet test --no-build -c ${{ matrix.configuration }} --verbosity normal --filter "Category!=RequiresPak"
